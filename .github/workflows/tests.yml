name: Tests and exact data
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
      - name: Installed tests
        run: python -I -B -m unittest discover -s tests -v
      - name: Exact data and independent finite oracle
        if: matrix.python-version == '3.11'
        run: |
          python -I -B reproduce/check_saved_results.py
          python -I -B experiments/independent_ellipse_audit.py
          python -I -B reproduce/verify_package.py --skip-tests
